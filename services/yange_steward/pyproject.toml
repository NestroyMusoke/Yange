[project]
name = "yange-steward"
version = "0.1.0"
description = "Supervised Google ADK reasoning layer for Yange"
requires-python = ">=3.11"
dependencies = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "google-auth>=2.40.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0,<9.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yange_steward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
